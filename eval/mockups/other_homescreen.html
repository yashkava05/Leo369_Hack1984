<!doctype html>
<!-- Synthetic eval mock-up of a phone lock screen. Notification senders and text are fake. Phone: 390x844 @3x -> 1170x2532 -->
<html><head><meta charset="utf-8"><title>other_homescreen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(170deg,#3a1c71,#d76d77 60%,#ffaf7b);color:#fff;position:relative}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-weight:600;font-size:15px}
.date{text-align:center;font-size:20px;margin-top:40px;opacity:.9}
.clock{text-align:center;font-size:96px;font-weight:600;letter-spacing:-2px;line-height:1.05}
.notes{position:absolute;top:360px;left:12px;right:12px}
.n{background:rgba(255,255,255,.28);backdrop-filter:blur(10px);border-radius:18px;padding:12px 14px;margin-bottom:10px;color:#111;font-size:14px;line-height:1.35}
.n .h{display:flex;justify-content:space-between;font-size:12px;color:#333;margin-bottom:3px}
.n b{display:block}
.bot{position:absolute;bottom:34px;left:40px;right:40px;display:flex;justify-content:space-between;font-size:22px}
.bot div{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="status"><span>Carrier</span><span>▮▮▮ 87% ▭</span></div>
<div class="date">Saturday, November 7</div>
<div class="clock">9:41</div>
<div class="notes">
  <div class="n"><div class="h"><span>💬 MESSAGES</span><span>now</span></div><b>Sam Ortiz</b>running 10 min late, save me a seat</div>
  <div class="n"><div class="h"><span>📅 CALENDAR</span><span>12m ago</span></div><b>Dentist with Dr. Kowalski</b>Today at 3:30 PM</div>
  <div class="n"><div class="h"><span>🔋 BATTERY</span><span>1h ago</span></div><b>Optimized charging</b>Your phone will finish charging by 7:00 AM</div>
</div>
<div class="bot"><div>🔦</div><div>📷</div></div>
</body></html>
