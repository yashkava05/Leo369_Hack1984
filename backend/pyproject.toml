[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-backend"
version = "0.1.0"
description = "PrismLocal backend: local-first screenshot-to-action API."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "sse-starlette",
    "python-multipart",
    "python-dotenv",
    "presidio-analyzer",
    "spacy",
    "pillow",
    "presidio-analyzer",
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "python-dateutil",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
voice = ["faster-whisper>=1.1.0,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ollama: live test that needs a running Ollama with the model pulled",
    "live: live test that calls the real Tavily or Exa API (needs TAVILY_API_KEY or EXA_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
"app.pipeline" = ["native/*.swift"]
